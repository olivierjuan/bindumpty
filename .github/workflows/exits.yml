name: milestone-exits

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  exits:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: M1, script: humpty/king/m1_exit.py }
          - { name: M2, script: humpty/king/m2_exit.py }
          - { name: M4, script: humpty/king/m4_exit.py }
          - { name: acceptance, script: humpty/king/acceptance.py }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: |
          sudo apt-get update && sudo apt-get install -y clang
          pip install -e ".[dev]"

      - name: Build toys
        run: |
          ./toys/case-01-leaf/build.sh
          ./toys/case-02-mem/build.sh

      - name: "Exit criterion: ${{ matrix.name }}"
        run: python ${{ matrix.script }}
        timeout-minutes: 30

      - name: Upload divergence artifacts (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: divergences-${{ matrix.name }}
          path: |
            horses/corpus/**/counterexamples/
            crash-*
          if-no-files-found: ignore
