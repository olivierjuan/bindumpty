name: docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: |
          sudo apt-get update && sudo apt-get install -y clang
          pip install -e ".[dev]"
          pip install "mkdocs-material" "mkdocstrings[python]" \
                      mkdocs-gen-files mkdocs-minify-plugin

      - name: Build the toys (modules read built artifacts at import time)
        run: |
          ./toys/case-01-leaf/build.sh
          ./toys/case-02-mem/build.sh

      - name: Generate the API reference pages
        run: python docs/gen_ref_pages.py

      - name: Build the site (strict: warnings are errors)
        run: python -m mkdocs build --strict

      - name: Publish to gh-pages
        if: github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: site
          force_orphan: true
